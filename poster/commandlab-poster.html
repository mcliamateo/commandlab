<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CommandLab Poster</title>
<style>
  @page { size: 24in 36in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2304px; height: 3456px; background: #0a0a0a; }
  body {
    position: relative;
    overflow: hidden;
    font-family: Oxanium, "Segoe UI", system-ui, sans-serif;
    color: #fafafa;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  /* dotted grid background */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.12) 2px, transparent 2px);
    background-size: 48px 48px;
  }
  .glow {
    position: absolute; width: 1600px; height: 1600px; right: -600px; top: -500px;
    background: radial-gradient(circle, rgba(31,220,255,.22), transparent 60%);
  }
  .wrap { position: absolute; inset: 120px 130px; display: flex; flex-direction: column; }

  /* header */
  header { display: flex; flex-direction: column; align-items: flex-start; gap: 48px; }
  .brand { display: flex; align-items: center; gap: 44px; }
  .brand svg { width: 400px; height: auto; color: #fafafa; }
  .brand .word { font-size: 170px; font-weight: 300; letter-spacing: .03em; line-height: 1; }
  .brand .word b { font-weight: 800; }
  .kicker {
    font-size: 48px; letter-spacing: .3em; text-transform: uppercase; color: #1fdcff;
    border: 4px solid #1fdcff; padding: 18px 36px;
  }

  /* hero */
  .hero { margin-top: auto; margin-bottom: auto; }
  .hero .line1 { font-size: 180px; font-weight: 300; line-height: 1; letter-spacing: .01em; }
  .hero .line2 { font-size: 355px; font-weight: 800; line-height: .92; text-transform: uppercase; letter-spacing: -.01em; }
  .hero .line2 span { color: #1fdcff; }
  .hero .cycle {
    margin-top: 110px; font-size: 130px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em;
    color: #fafafa;
  }
  .hero .cycle i { font-style: normal; color: #1fdcff; }
  .sub { margin-top: 110px; font-size: 76px; line-height: 1.35; color: #a3a3a3; max-width: 1800px; }

  /* chain */
  .chain { margin-top: 110px; display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .chain span {
    font-size: 42px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    padding: 22px 30px; border: 3px solid #404040; background: #171717;
  }
  .chain span.hot { border-color: #1fdcff; color: #1fdcff; }
  .chain em { font-style: normal; font-size: 48px; color: #525252; }

  /* services */
  .section-title { margin-top: 90px; font-size: 64px; letter-spacing: .3em; text-transform: uppercase; color: #1fdcff; }
  .services { margin-top: 50px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
  .card {
    background: #171717; border: 3px solid #262626; padding: 40px 32px; height: 480px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .card { height: 420px; }
  .card .n { font-size: 44px; color: #1fdcff; font-weight: 700; }
  .card h3 { margin-top: 36px; font-size: 38px; font-weight: 800; text-transform: uppercase; line-height: 1.1; overflow-wrap: normal; word-break: keep-all; }
  .card p { margin-top: 28px; font-size: 36px; line-height: 1.35; color: #a3a3a3; }

  /* projects */
  .projects { margin-top: 60px; display: flex; flex-wrap: wrap; gap: 20px 24px; }
  .projects span {
    font-size: 48px; padding: 20px 36px; border: 3px solid #404040; color: #e5e5e5;
  }

  /* footer */
  footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 4px solid #1fdcff; padding-top: 60px;
  }
  .cta { font-size: 132px; font-weight: 800; text-transform: uppercase; line-height: 1; }
  .cta span { color: #1fdcff; }
  .qrs { display: flex; gap: 56px; }
  .qrs figure { text-align: center; }
  .qrs img { display: block; width: 300px; height: 300px; background: #fff; padding: 16px; }
  .qrs figcaption { margin-top: 22px; font-size: 40px; line-height: 1.3; color: #e5e5e5; }
  .qrs figcaption b { color: #1fdcff; font-weight: 700; font-size: 34px; }

  /* chamfered corner brackets on the frame */
  .frame { position: absolute; inset: 40px; border: 0; pointer-events: none; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 140px; height: 140px; border: 0; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <!-- CommandLab mark (C:>_) from the site's brand.tsx -->
      <svg viewBox="0 0 177 64" fill="currentColor" aria-hidden="true">
        <path d="M54 6H18L6 18V46L18 58H54" fill="none" stroke="currentColor" stroke-width="12"/>
        <rect x="68" y="14" width="12" height="12"/>
        <rect x="68" y="38" width="12" height="12"/>
        <polygon points="92,0 109,0 141,32 109,64 92,64 124,32"/>
        <rect x="133" y="52" width="44" height="12" fill="#1fdcff"/>
      </svg>
      <div class="word">COMMAND<b>LAB</b></div>
    </div>
    <div class="kicker">Tech Solutions</div>
  </header>

  <section class="hero">
    <div class="line1">we solve</div>
    <div class="line2">Problems<span>.</span></div>
    <div class="cycle">Hardware <i>/</i> Software <i>/</i> Solutions</div>
    <p class="sub">Tech solutions for your business, from the devices on your counter to the software in the cloud.</p>
  </section>

  <footer>
    <div class="cta">Let's build<br/><span>it.</span></div>
    <div class="qrs">
      <figure>
        <img src="qr-website.svg" alt="QR code for the CommandLab website" />
        <figcaption>Visit our website<br/><b>commandlab-lyart.vercel.app</b></figcaption>
      </figure>
      <figure>
        <img src="qr-facebook.svg" alt="QR code for the CommandLab Facebook page" />
        <figcaption>Message us on Facebook<br/><b>facebook.com/CommandLab</b></figcaption>
      </figure>
    </div>
  </footer>
</div>
</body>
</html>
